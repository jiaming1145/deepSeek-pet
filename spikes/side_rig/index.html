<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' file: 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:;">
<title>side rig lab</title>
<script type="importmap">
{ "imports": { "three": "../../apps/desktop/node_modules/three/build/three.module.js" } }
</script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden;
    font: 15px/1.55 "Segoe UI", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; font: 11px/1.35 Consolas, monospace; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: pre; pointer-events: none; }

  /* her speech bubble: floats over the desktop, so it must read on any wallpaper and never eat a click */
  #say { position: fixed; left: 0; top: 0; max-width: 260px; padding: 9px 13px; border-radius: 15px;
    background: rgba(255, 255, 255, 0.96); color: #16233a; border: 1.5px solid rgba(40, 70, 120, 0.30);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28); font-size: 15px; line-height: 1.4;
    pointer-events: none; opacity: 0; transform: translate(-50%, -100%) scale(0.92);
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.2, 1.5, 0.4, 1); white-space: pre-wrap; }
  #say.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  #say::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px;
    border: 8px solid transparent; border-top-color: rgba(255, 255, 255, 0.96); border-bottom: 0; }

  /* the chat box. Unlike the bubble this one IS interactive, so pet.js has to include it in the hit region or
     the window stays click-through and you cannot type into it. */
  #chat { position: fixed; right: 26px; bottom: 26px; width: 380px; max-height: 62vh;
    display: none; flex-direction: column; border-radius: 16px; overflow: hidden;
    background: rgba(252, 253, 255, 0.97); border: 1.5px solid rgba(40, 70, 120, 0.28);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.34); color: #16233a; }
  #chat.on { display: flex; }
  #chatHead { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    background: linear-gradient(180deg, #1f3d78, #16305f); color: #eaf1ff; font-size: 13px; font-weight: 600; }
  #chatHead .dot { width: 8px; height: 8px; border-radius: 50%; background: #7fe0a0; }
  #chatHead .grow { flex: 1; }
  #chatHead button { all: unset; cursor: pointer; padding: 2px 8px; border-radius: 6px; font-size: 15px; opacity: 0.75; }
  #chatHead button:hover { opacity: 1; background: rgba(255, 255, 255, 0.16); }
  #chatLog { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #chatLog .msg { max-width: 100%; white-space: pre-wrap; word-break: break-word; }
  #chatLog .her { background: #eef3fd; border: 1px solid rgba(40, 70, 120, 0.16); border-radius: 4px 14px 14px 14px; padding: 9px 12px; }
  #chatLog .you { align-self: flex-end; background: #1f3d78; color: #f2f6ff; border-radius: 14px 4px 14px 14px; padding: 8px 12px; max-width: 84%; }
  #chatLog .act { color: #6b7f9e; font-style: italic; }        /* her （…） stage directions */
  #chatLog .sys { color: #8a93a3; font-size: 13px; text-align: center; }
  #chatBar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid rgba(40, 70, 120, 0.14); background: rgba(240, 244, 251, 0.9); }
  #chatIn { flex: 1; border: 1.5px solid rgba(40, 70, 120, 0.22); border-radius: 10px; padding: 8px 11px;
    font: inherit; font-size: 14px; outline: none; background: #fff; color: #16233a; }
  #chatIn:focus { border-color: #2f5ba8; }
  #chatSend { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 10px; background: #1f3d78; color: #fff; font-size: 14px; }
  #chatSend:hover { background: #2a4f96; }
  #chatSend[disabled] { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="say"></div>
<div id="chat">
  <div id="chatHead"><span class="dot"></span><span class="grow">鲸鱼娘</span><button id="chatClose" title="close">×</button></div>
  <div id="chatLog"></div>
  <div id="chatBar">
    <input id="chatIn" type="text" placeholder="和她说点什么…" autocomplete="off" maxlength="500">
    <button id="chatSend">送出</button>
  </div>
</div>
<script type="module" src="./pet.js"></script>
</body>
</html>
