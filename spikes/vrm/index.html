<script type="module">

// VRM lab: a stock VRM 1.0 model in the pet window with the layers the 3D pet needs, stacked in a
// fixed order every frame:
//   reset normalized pose -> clip layer (AnimationMixer, crossfaded Quaternius / VRMA / Mixamo clips
//   through the shared retargeter in anim/retarget/) -> procedural idle arm pose (only when no clip)

// ------------------------------------------------------------------ state

// ------------------------------------------------------------------ clip library (shared loaders)
const CLIPS = new Map();          // name -> AnimationClip (already retargeted onto this VRM)
const clipLoad = {};
{
  const t0 = performance.now();
  const q = await loadQuaterniusAnimations(QUAT_GLB, vrm, { names: QUAT_CLIPS });
  for (const [n, c] of q) CLIPS.set('quaternius:' + n, c);

// One mixer, crossfades between actions. `play(name, opts)`: opts.loop (default true), opts.fade s,

// per-clip playback options for the queued follow-ups

// action vocabulary -> clip route

  walk: () => play('quaternius:Walk_Loop', { fade: 0.25 }),
  sit: () => play('quaternius:Sitting_Enter', { loop: false, fade: 0.25, then: 'quaternius:Sitting_Idle_Loop' }),
  stand: () => play('quaternius:Sitting_Exit', { loop: false, fade: 0.25 }),
  jump: () => play('quaternius:Jump_Start', { loop: false, fade: 0.15, then: 'quaternius:Jump_Land' }),
  wave: () => play('quaternius:Interact', { loop: false, fade: 0.25 }),   // no Wave in Quaternius Standard; Interact is the one-arm reach-forward greeting stand-in (ACTION_CLIPS.json)

// ------------------------------------------------------------------ mouse look

function applyLook() {
  // put the target on a plane a little in front of the face, spanning +-1.2 m
  lookTarget.position.set(S.mouse.x * 1.2, headY + S.mouse.y * 0.9, 1.2);
}

// ------------------------------------------------------------------ blink

  const p = (blinkT - nextBlink) / 0.18;          // 180 ms blink: fast close, slower open

// ------------------------------------------------------------------ lip flap
let talkT = 0;
function visemes(dt) {
  const out = {}; for (const v of VIS) out[v] = 0;
  if (S.forcedVis) { out[S.forcedVis] = 1; return out; }
  if (!S.talk) return out;

  const i = Math.floor(talkT / 0.13) % cyc.length, ph = (talkT / 0.13) % 1;

// ------------------------------------------------------------------ procedural layers
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const rotZ = (n, a) => B(n)?.quaternion.multiply(_q.setFromAxisAngle(_v.set(0, 0, 1), a));

// VRM 1.0 rest is a T-pose: this brings the arms down to a relaxed stance. Only used when no
// clip is playing (the normal state is the Idle_Loop clip).
function idlePose() {

  rotZ('rightLowerArm', 8 * DEG); rotZ('leftLowerArm', -8 * DEG);
  rotY('rightLowerArm', 12 * DEG); rotY('leftLowerArm', -12 * DEG);
}
let clock = 0;
function breathing(dt) {
  if (!S.breathe) return;

  rotX('spine', -1.5 * DEG * b); rotX('chest', -2.2 * DEG * b); rotX('upperChest', -1.4 * DEG * b);
  rotX('neck', 1.0 * DEG * b); rotX('head', 0.8 * DEG * b);
  rotZ('spine', 0.6 * DEG * Math.sin(clock * 2 * Math.PI / 7.1));   // slow sway

function hop() {

  let y = 0, sy = 1;
  if (p < 0.2) { const k = smooth(p / 0.2); sy = 1 - 0.14 * k; }

  S.hop.y = y; S.hop.sy = sy;

  const bend = clamp((1 - sy) * 4, 0, 1) * 35 * DEG;
  rotX('rightUpperLeg', -bend * 0.8); rotX('leftUpperLeg', -bend * 0.8);
  rotX('rightLowerLeg', bend * 1.6); rotX('leftLowerLeg', bend * 1.6);

}
// Two-bone analytic IK: upper arm aims the chain at the target, forearm supplies the elbow

  const target = S.reach, w = S.action === 'reach' ? smooth(clamp(S.t / 0.5, 0, 1)) : 1;

// each frame it measures where the clip + breathing left the head pointing (in the model root's
// frame, so it stays right while the model walks sideways), clamps the target relative to the
// body's own facing (hips forward), smooths the residual (exponential, ~120 ms), splits it
// head 60 / neck 25 / chest 15 %, then applies one correction step on the head bone so the head's
// forward axis lands on the target even though the chain rotations are not exactly additive.

  for (let i = 0; i < N; i++) {
    for (const [f, min] of [['l', minL], ['r', minR]]) {
      if (samples[i][f].y < min + 0.02 && samples[i + 1][f].y < min + 0.02) vs.push(-(samples[i + 1][f].z - samples[i][f].z) / dt);
    }
  }
  vs.sort((a, b) => a - b);
  const speed = vs.length ? vs[Math.floor(vs.length / 2)] : 0;
  const out = { speed: +speed.toFixed(3), plantedSamples: vs.length, duration: clip.duration, strideM: +(speed * clip.duration).toFixed(3) };
  clipSpeedCache.set(name, out);
  return out.speed;
}

// spring nudge: a damped spring on the model root so hair/skirt/ribbons get an impulse
function nudge(dt) {
  const k = 90, c = 2 * Math.sqrt(k) * 0.55;
  S.nudgeV.addScaledVector(S.nudgeP, -k * dt).addScaledVector(S.nudgeV, -c * dt);
  S.nudgeP.addScaledVector(S.nudgeV, dt);
}

// ------------------------------------------------------------------ expressions
function expressions(dt) {
  const em = vrm.expressionManager;
  for (const e of EXPR) {
    S.exprW[e] = lerp(S.exprW[e], S.exprTarget[e], 1 - Math.exp(-dt / 0.09));  // ~250 ms crossfade
    if (e !== 'neutral') em.setValue(e, S.exprW[e]);
  }
  em.setValue('blink', blinkWeight(dt));
  const v = visemes(dt); for (const k of VIS) em.setValue(k, v[k]);
}

// ------------------------------------------------------------------ stats
const stats = { frames: 0, ms: [], t0: performance.now(), last: performance.now() };
function statsFrame(now) { stats.ms.push(now - stats.last); stats.last = now; stats.frames++; if (stats.ms.length > 2000) stats.ms.shift(); }

// ------------------------------------------------------------------ frame
let prev = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now; clock += dt; S.t += dt;
  statsFrame(now);

  // Clip layer. IMPORTANT: no resetNormalizedPose() while a clip plays. three's PropertyMixer only
  // writes a bone when the blended value differs from what it wrote last time, so a track with a
  // constant value (Sitting_Idle_Loop's knees, its hips height) is written once and never again;
  // resetting the pose every frame then leaves those bones at rest (found the hard way, see
  // REPORT_unify.md). Instead: mixer -> snapshot the clip pose -> procedural layers -> render ->
  // restore the snapshot, so the bones always hold exactly what the mixer last wrote.
  model.scale.set(1, 1, 1);
  if (S.current) { S.mixer.update(dt); savePose(); }
  else { hum.resetNormalizedPose(); idlePose(); }      // no clip: procedural stance
  breathing(dt);
  hop();
  if (S.action === 'hop' && S.t >= S.actionDur) S.action = 'idle';
  if (S.reach) { preIK.up.copy(B('rightUpperArm').quaternion); preIK.lo.copy(B('rightLowerArm').quaternion); ikReach(); model.updateWorldMatrix(true, true); S.ikErr = B('rightHand').getWorldPosition(_v3).distanceTo(S.reach); }
  else if (S.look) applyLook();
  walkStep(dt);
  headTurn(dt);
  nudge(dt);
  const wx = S.walk ? S.walk.x : 0;
  model.position.set(wx + S.nudgeP.x, S.hop.y + S.nudgeP.y, S.nudgeP.z);
  expressions(dt);
  vrm.update(dt);
  renderer.render(scene, camera);
  if (S.current) restorePose();
  if (S.hudOn) drawHud();
}
// pose snapshot of every normalized humanoid bone (rotation; hips also position)
const POSE_NODES = Object.keys(hum.humanBones).map((n) => B(n)).filter(Boolean);
const poseSnap = POSE_NODES.map(() => ({ q: new THREE.Quaternion(), p: new THREE.Vector3() }));
function savePose() { for (let i = 0; i < POSE_NODES.length; i++) { poseSnap[i].q.copy(POSE_NODES[i].quaternion); poseSnap[i].p.copy(POSE_NODES[i].position); } }
function restorePose() { for (let i = 0; i < POSE_NODES.length; i++) { POSE_NODES[i].quaternion.copy(poseSnap[i].q); POSE_NODES[i].position.copy(poseSnap[i].p); } }
function drawHud() {
  const n = Math.min(stats.ms.length, 120), recent = stats.ms.slice(-n), avg = recent.reduce((a, b) => a + b, 0) / (n || 1);
  hud.textContent = `vrm lab  ${(1000 / avg).toFixed(0)} fps  ${avg.toFixed(1)} ms\n` +
    `expr ${S.expr}  clip ${S.clipName || '-'}${S.current ? ' t=' + S.current.time.toFixed(2) : ''}  head ${(S.head.yaw / DEG).toFixed(0)}/${(S.head.pitch / DEG).toFixed(0)} deg${S.walk ? '  walk ' + S.walk.phase + ' x=' + S.walk.x.toFixed(2) : ''}\n` +
    `[1-5] happy angry sad relaxed surprised [0] neutral\n[B] blink ${S.blink ? 'on' : 'off'}  [T] talk ${S.talk ? 'on' : 'off'}  [L] look ${S.look ? 'on' : 'off'}  [E] head-turn ${S.headTurn ? 'on' : 'off'}  [I] breathe ${S.breathe ? 'on' : 'off'}\n` +
    `[W] wave(Interact)  [J] jump  [S] sit/stand  [K] walk across  [H] hop  [N] nudge  [R] reach->mouse\n[A] vrma clip  [M] mixamo clip  [Space] stop clips  [G] hud`;
}

// ------------------------------------------------------------------ control surface
const lab = window.lab = {
  expression(name) { if (!EXPR.includes(name)) throw new Error('unknown expression ' + name); S.expr = name; for (const e of EXPR) S.exprTarget[e] = e === name ? 1 : 0; },
  expressions: () => EXPR.slice(),
  action(name, dur) {
    if (ACTIONS[name]) return ACTIONS[name]();
    S.action = name; S.t = 0; S.actionDur = dur ?? (name === 'hop' ? 1.1 : 2);
  },
  setPhase(p) { S.t = p * S.actionDur; },
  clip: (name, opts) => play(name, opts), clips: () => [...CLIPS.keys()], clipLoad: () => clipLoad,
  clipTime(t) { if (S.current) { S.current.time = t; S.mixer.update(0); savePose(); } },
  clipState() { return S.current ? { name: S.clipName, time: S.current.time, weight: S.current.getEffectiveWeight(), queued: S.clipQueue, running: S.current.isRunning() } : null; },
  mixerWeights() { const out = {}; for (const [n, c] of CLIPS) { const a = S.mixer.existingAction(c); if (a && a.isRunning()) out[n] = +a.getEffectiveWeight().toFixed(3); } return out; },
  play: playFile, stop: stopClips,
  walk: (opts) => { startWalk(opts); return { speed: S.walk.speed, xMax: +S.walk.xMax.toFixed(3), halfW: +halfW.toFixed(3) }; },
  walkState() { return S.walk ? { phase: S.walk.phase, leg: S.walk.leg, x: +S.walk.x.toFixed(3), yawDeg: +(S.walk.yaw / DEG).toFixed(1), t: +S.walk.t.toFixed(2) } : null; },
  clipSpeed(name) { clipSpeed(name); return clipSpeedCache.get(name); },
  reach(x, y, z) { if (x == null) { S.reach = null; if (S.action === 'reach') S.action = 'idle'; return; } S.reach = new THREE.Vector3(x, y, z); S.action = 'reach'; S.t = 0; },
  reachScreen(nx, ny) { lab.reach(nx * 0.7, headY - 0.2 + ny * 0.5, 0.45); },
  look(nx, ny) { if (nx == null) { S.lookLock = false; return; } S.lookLock = true; S.mouse.x = nx; S.mouse.y = ny; },   // scripted look: locks out real mouse moves (Chromium also synthesises mousemove after layout changes); look(null) unlocks
  headTurnOn(on) { S.headTurn = on; },
  head() { // applied head-turn (deg) and the measured yaw/pitch of the normalized head bone's forward axis, model frame
    model.updateWorldMatrix(true, true); model.getWorldQuaternion(_mInv).invert(); const f = fwdInModel(B('head'), { yaw: 0, pitch: 0 }), b = fwdInModel(B('hips'), { yaw: 0, pitch: 0 }), m = S.head.measured ?? f;
    const d = (r) => +(r / DEG).toFixed(1);
    return { appliedYawDeg: d(S.head.yaw), appliedPitchDeg: d(S.head.pitch), targetYawDeg: S.head.target ? d(S.head.target.yaw) : null, targetPitchDeg: S.head.target ? d(S.head.target.pitch) : null, headYawDeg: d(m.yaw), headPitchDeg: d(m.pitch), clipHeadYawDeg: d(f.yaw), clipHeadPitchDeg: d(f.pitch), bodyYawDeg: d(b.yaw), mouse: [S.mouse.x, S.mouse.y], clip: S.clipName };
  },
  trackInfo(clipName, bone) { // retargeted clip data as the page holds it
    const clip = CLIPS.get(clipName); const node = B(bone); const tr = clip.tracks.find((t) => t.name === node.name + '.quaternion');
    if (!tr) return { error: 'no track', nodeName: node.name, sample: clip.tracks.slice(0, 3).map((t) => t.name) };
    const ip = tr.createInterpolant(); const at = (t) => Array.from(ip.evaluate(t)).map((x) => +x.toFixed(3));
    const angle = (q) => +(2 * Math.acos(Math.min(1, Math.abs(q[3]))) / DEG).toFixed(1);
    return { track: tr.name, keys: tr.times.length, t0: tr.times[0], tEnd: +tr.times[tr.times.length - 1].toFixed(3), interp: ip.constructor.name, samples: [0, 0.3, 0.6, 0.9, 1.2, 1.5].map((t) => ({ t, q: at(t), deg: angle(at(t)) })) };
  },
  knee() { const a = (n) => +(2 * Math.acos(Math.min(1, Math.abs(B(n).quaternion.w))) / DEG).toFixed(1); return { leftUpperLeg: a('leftUpperLeg'), leftLowerLeg: a('leftLowerLeg'), rightLowerLeg: a('rightLowerLeg'), hipsY: +B('hips').position.y.toFixed(3), weights: lab.mixerWeights(), clip: lab.clipState() }; },
  probe() { // debugging: where is everything, in world metres / degrees
    model.updateWorldMatrix(true, true); model.getWorldQuaternion(_mInv).invert(); const r3 = (v) => v.toArray().map((x) => +x.toFixed(3));
    const fwd = (node) => { const o = fwdInModel(node, { yaw: 0, pitch: 0 }); return { yaw: +(o.yaw / DEG).toFixed(1), pitch: +(o.pitch / DEG).toFixed(1) }; };
    return { hips: r3(B('hips').getWorldPosition(new THREE.Vector3())), head: r3(B('head').getWorldPosition(new THREE.Vector3())), model: r3(model.position), modelYaw: +(model.rotation.y / DEG).toFixed(1), target: r3(lookTarget.position), applied: { yaw: +(S.head.yaw / DEG).toFixed(1), pitch: +(S.head.pitch / DEG).toFixed(1) }, headFwd: fwd(B('head')), chestFwd: fwd(B('upperChest')), hipsFwd: fwd(B('hips')), clip: S.clipName, t: S.current?.time };
  },
  blink(on) { S.blink = on; }, forceBlink(w) { S.forcedBlink = w; },
  talk(on) { S.talk = on; talkT = 0; }, forceViseme(v) { S.forcedVis = v; },
  breathe(on) { S.breathe = on; }, lookOn(on) { S.look = on; },
  nudge(x, y, z) { S.nudgeV.add(new THREE.Vector3(x, y, z ?? 0)); },
  hud(on) { S.hudOn = on; if (!on) hud.textContent = ''; },
  setTime(t) { clock = t; },
  resetStats() { stats.ms.length = 0; stats.frames = 0; stats.t0 = performance.now(); },
  stats() {
    const ms = stats.ms.slice().sort((a, b) => a - b), n = ms.length, sum = ms.reduce((a, b) => a + b, 0);
    return { frames: stats.frames, seconds: (performance.now() - stats.t0) / 1000, avgMs: sum / n, p50Ms: ms[Math.floor(n * 0.5)], p95Ms: ms[Math.floor(n * 0.95)], maxMs: ms[n - 1], fps: stats.frames / ((performance.now() - stats.t0) / 1000), dpr: devicePixelRatio, size: [renderer.domElement.width, renderer.domElement.height] };
  },
  info() {
    const em = vrm.expressionManager, sb = vrm.springBoneManager;
    let joints = 0; sb?.joints.forEach(() => joints++);
    return { meta: vrm.meta.name, metaVersion: vrm.meta.metaVersion, licenseUrl: vrm.meta.licenseUrl, expressions: em.expressions.map((e) => e.expressionName), springJoints: joints, springs: sb?.springs?.size ?? sb?.springs?.length, lookAt: vrm.lookAt?.constructor?.name, bones: Object.keys(hum.humanBones).length, height: size.y, materials: [...new Set(vrm.materials?.map((m) => m.type))], threeRevision: THREE.REVISION, clips: [...CLIPS.keys()], clipLoad, halfW: +halfW.toFixed(3) };
  },
  arm() { model.updateWorldMatrix(true, true); const s = B('rightUpperArm').getWorldPosition(new THREE.Vector3()), e = B('rightLowerArm').getWorldPosition(new THREE.Vector3()), h = B('rightHand').getWorldPosition(new THREE.Vector3()); return { shoulder: s.toArray(), length: s.distanceTo(e) + e.distanceTo(h) }; },
  ikError() { return S.reach ? S.ikErr : null; },   // measured inside the frame, after IK and before the clip-pose restore
  springSample() {
    const out = []; model.updateWorldMatrix(true, true);
    vrm.springBoneManager?.joints.forEach((j) => { if (out.length < 6 && j.child) out.push(+(j.child.getWorldPosition(new THREE.Vector3()).x - model.position.x).toFixed(4)); }); return out;
  },
};
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  const ex = { 1: 'happy', 2: 'angry', 3: 'sad', 4: 'relaxed', 5: 'surprised', 0: 'neutral' }[k]; if (ex) return lab.expression(ex);
  if (k === 'b') lab.blink(!S.blink); else if (k === 't') lab.talk(!S.talk); else if (k === 'l') lab.lookOn(!S.look); else if (k === 'i') lab.breathe(!S.breathe); else if (k === 'e') lab.headTurnOn(!S.headTurn);
  else if (k === 'w') ACTIONS.wave(); else if (k === 'j') ACTIONS.jump(); else if (k === 's') (S.clipName?.startsWith('quaternius:Sitting') ? ACTIONS.stand() : ACTIONS.sit());
  else if (k === 'k') { if (!S.walk) startWalk(); }
  else if (k === 'h') lab.action('hop'); else if (k === 'n') lab.nudge(0.9 * (Math.random() < 0.5 ? -1 : 1), 0.3);
  else if (k === 'r') { S.reach ? lab.reach(null) : lab.reachScreen(S.mouse.x, S.mouse.y); }
  else if (k === 'a') lab.play('vrma', './clips/test.vrma').catch((err) => { window.__error = String(err.stack || err); });
  else if (k === 'm') lab.play('mixamo', './clips/SambaDancing.fbx').catch((err) => { window.__error = String(err.stack || err); });
  else if (k === ' ') lab.stop(); else if (k === 'g') lab.hud(!S.hudOn);
});
ACTIONS.idle();                       // the clip route is the default state
requestAnimationFrame(frame);
window.__ready = true;
</script>
