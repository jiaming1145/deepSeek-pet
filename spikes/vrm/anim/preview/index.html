<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>anim preview</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; font: 12px/1.3 Consolas, monospace; color: #fff;
         background: rgba(0,0,0,.55); padding: 4px 6px; border-radius: 4px; white-space: pre; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../node_modules/three/build/three.module.js",
    "three/examples/jsm/": "../node_modules/three/examples/jsm/",
    "three/addons/": "../node_modules/three/examples/jsm/",
    "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
    "@pixiv/three-vrm-core": "../node_modules/@pixiv/three-vrm-core/lib/three-vrm-core.module.js",
    "@pixiv/three-vrm-animation": "../node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
  }
}
</script>
</head>
<body>
<div id="hud">loading</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { loadQuaterniusAnimations, loadVRMAnimation, attachLookAtProxy, loadMixamoAnimation } from '../retarget/index.js';

window.__error = null;
window.addEventListener('error', (e) => { window.__error = String(e.error?.stack || e.message); });
window.addEventListener('unhandledrejection', (e) => { window.__error = String(e.reason?.stack || e.reason); });

const hud = document.getElementById('hud');
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 50);
camera.position.set(0, 1.0, 4.2);
camera.lookAt(0, 0.85, 0);
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const key = new THREE.DirectionalLight(0xffffff, Math.PI * 0.6);
key.position.set(1, 2, 3);
scene.add(key);
// floor line so hips height / foot contact is readable in screenshots
const grid = new THREE.GridHelper(2, 8, 0x66aaff, 0x335577);
grid.material.transparent = true; grid.material.opacity = 0.6;
scene.add(grid);

const loader = new GLTFLoader();
loader.register((p) => new VRMLoaderPlugin(p));
const gltf = await loader.loadAsync('../testdata/VRM1_Constraint_Twist_Sample.vrm');
const vrm = gltf.userData.vrm;
VRMUtils.removeUnnecessaryVertices(gltf.scene);
VRMUtils.combineSkeletons(gltf.scene);
vrm.scene.rotation.y = 0; // VRM1 faces +Z; camera is on +Z so she faces us
scene.add(vrm.scene);
attachLookAtProxy(vrm);

const mixer = new THREE.AnimationMixer(vrm.scene);
let quat = null;
let current = null;
let currentName = 'none';
let clock = new THREE.Clock();
let paused = false;

async function ensureQuaternius() {
  if (!quat) quat = await loadQuaterniusAnimations('../quaternius/Animation%20Library%5BStandard%5D/Godot/AnimationLibrary_Godot_Standard.glb', vrm);
  return quat;
}
function play(clip, name) {
  if (current) current.stop();
  vrm.humanoid.resetNormalizedPose();
  current = mixer.clipAction(clip);
  current.reset().setLoop(THREE.LoopRepeat, Infinity).play();
  currentName = name;
  return { name, duration: clip.duration, tracks: clip.tracks.length };
}

window.lab = {
  async quaternius(name) { const m = await ensureQuaternius(); const c = m.get(name); if (!c) throw new Error('no clip ' + name); return play(c, 'quaternius/' + name); },
  async quaterniusNames() { return [...(await ensureQuaternius()).keys()]; },
  async vrma(file) { const c = await loadVRMAnimation('../vrma/' + file, vrm); return play(c, 'vrma/' + file); },
  async mixamo(file) { const c = await loadMixamoAnimation('../mixamo/' + file, vrm); return play(c, 'mixamo/' + file); },
  setTime(t) { paused = true; if (current) { current.paused = false; current.time = t; } mixer.update(0); vrm.update(0); render(); return t; },
  resume() { paused = false; },
  camera(x, y, z, ty) { camera.position.set(x, y, z); camera.lookAt(0, ty ?? 0.85, 0); },
  name() { return currentName; },
};

function render() {
  hud.textContent = `${currentName}  t=${current ? current.time.toFixed(2) : '-'}`;
  renderer.render(scene, camera);
}
function tick() {
  requestAnimationFrame(tick);
  if (paused) return;
  const dt = clock.getDelta();
  mixer.update(dt);
  vrm.update(dt);
  render();
}
tick();
window.__ready = true;
</script>
</body>
</html>
